<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>清空数据</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-xl p-6 max-w-md w-full shadow-md">
    <h1 class="text-2xl font-bold text-center text-red-600 mb-4">清空所有数据</h1>
    <p class="text-gray-600 mb-6 text-center">点击下方按钮将永久删除所有量体记录，此操作不可恢复！</p>
    
    <button onclick="clearAllData()" class="w-full bg-red-600 text-white py-3 px-4 rounded-lg hover:bg-red-700 transition-colors font-medium">
      确认清空所有数据
    </button>
    
    <div class="mt-4 text-center text-sm text-gray-500">
      <p>操作完成后页面将自动刷新</p>
    </div>
  </div>

  <script>
    function clearAllData() {
      if (confirm('确定要清除所有数据吗？此操作不可恢复！')) {
        if (confirm('再次确认：所有量体记录将被永久删除！')) {
          localStorage.removeItem('yidingtong_persons');
          localStorage.removeItem('yidingtong_history');
          alert('所有数据已清空！');
          location.reload();
        }
      }
    }
  </script>
</body>
</html>
